<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heels Shoes Card</title>
    <style>
    *{
        
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }
        
    body{
        background-color: #f5f5f5;
        font-family: Arial, Helvetica, sans-serif;
        padding: 40px;
        display: flex;
    }

    .product-card{
        background-color: #fff;
        width: 330px;
        margin: 0 auto;
        border-radius: 16px;
        padding: 24px;
        border: 1px solid #e0e0e0;
        box-shadow: 0 10px 20px rgba(0 0 0 / 0.1);
    }

    .product-image {
        width: 100%;
        height: 220px;
        overflow: hidden;
        border-radius: 12px;
        margin-bottom: 20px;
    }

    .product-image img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .product-category {
        font-size: 12px;
        color: gray;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        font-weight: bold;
        margin-bottom: 8px;
    }

    .product-title {
        font-size: 22px;
        font-weight: bold;
        color: #1a1a1a;
        margin-bottom: 12px;
    }

    .product-description {
        font-size: 14px;
        color: #666;
        line-height: 1.6;
        margin-bottom: 20px;
        border-bottom: 1px solid #e0e0e0;
    }

    .price-section {
        margin-bottom: 20px;
       
    }
    .price-section .price {
        font-size: 26px;
        color: black;
        font-weight: bold;
    }

    .original-price {
        font-size: 15px;
        color: #999;
        text-decoration: line-through;
        margin-left: 8px;
    }

    .size-options-wrapper {
        border:none
        
    }

    .size-label-text {
        font-size: 13px;
        color: #333;
        font-weight: bold;
        margin-bottom: 12px;
    }

        .size-options {
            margin-bottom: 25px;
        }

    .size-options input[type="radio"] {
        display: none;
        }

    .size-options label {
        display: inline-block;
        width: 44px;
        height: 44px;
        border: 2px solid #eee;
        text-align: center;
        line-height: 40px;
        border-radius: 4px;
        margin-right: 8px;
        font-weight: bold;
        color: #555;
        cursor: pointer;
        cursor: pointer;
        border-radius: 8px;
        transition: all 0.3s ease;
    }

    .size-options input[type="radio"]:checked + label {
        background-color: #000;
        color: #fff;
        border-color: #000;
    }

    .buy-button {
        width: 100%;
        padding: 16px;
        background-color: #000;
        color: #fff;
        border: none;
        border-radius: 10px;
        text-transform: uppercase;
        font-weight: bold;
        letter-spacing: 1px;
        cursor: pointer;
        transition: background-color 0.3s ease;
    }

    .buy-button:hover {
        background-color: #333;
    }
    </style>
</head>
<body>
   <article class="product-card">
       <figure class="product-image">
              <img src="https://images.unsplash.com/photo-1605733513549-de9b150bd70d?fm=jpg&q=80&w=600&auto=format&fit=crop" alt="heels black-leather" >
       </figure>


       <p class="product-category">heels Black Leather</p>
       <h3 class="product-title">Black Leather Boot</h3>

       <p class="product-description">These black leather boots are perfect for any occasion. They are made from high-quality leather and feature a comfortable fit.</p>

      <div class="price-section">
          <span class="price">IDR 1,999,000</span>
          <del class="original-price">IDR 2,499,000</del>
      </div>


      <form action="">
      <fieldset class="size-options-wrapper">
          <legend class="size-label-text">pilih ukuran (us):</legend>
         <div class="size-options">
                 <input type="radio" name="size" id="size-7" value="7" checked>
                 
             <label for="size-7">7</label>
             
                 <input type="radio" name="size" id="size-8" value="8">
                
             <label for="size-8">8</label>
             
                 <input type="radio" name="size" id="size-9" value="9">
                
             <label for="size-9">9</label>
             
                 <input type="radio" name="size" id="size-10" value="10">
                 
             <label for="size-10">10</label>

                 <input type="radio" name="size" id="size-11" value="11">
                 
             <label for="size-11">11</label>

         </div>
      </fieldset>
      </form>
        <button class="buy-button" type="submit">Tambahkan ke keranjang</button>
   </article>
</body>
</html>
