<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coba text- text Overflow & text Shadow </title>
    <style>
        p{
            font-size: 26px;
            white-space: nowrap;
            width: 300px;
            background-color: lightcyan;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        h1{
            font-size: 100px;
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            text-shadow: 5px 5px 0 lightcoral;
            text-decoration: underline;
            text-decoration-style: wavy;
            text-decoration-color: aqua;
            text-decoration-skip-ink: none;
        }
    </style>
</head>
<body>
    <h1>Hello, CSS</h1>
    <P>Lorem ipsum dolor, sit amet consectetur adipisicing elit. Sint modi et, consequatur velit repellat praesentium sequi quis nemo nihil delectus aliquid natus fugit, voluptatibus omnis! Sequi inventore repellendus molestias enim.</P>
</body>
</html>
